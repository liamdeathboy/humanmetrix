<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscribed — Human Metrix</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#081B33;
  --navy-700:#0E2A52;
  --blue-400:#2E6FD9;
  --blue-200:#BBD3F5;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(150deg,var(--navy-900),var(--navy-700) 60%,var(--blue-400) 140%);color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}
.wrap{max-width:32rem;margin:auto;padding:3rem 1.5rem;text-align:center}
.mark{font-weight:800;letter-spacing:-.02em;font-size:1rem;color:#fff;text-decoration:none;display:inline-flex;align-items:baseline;gap:.4rem;margin-bottom:2.5rem}
.mark span{color:var(--blue-200)}
p.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-200);margin:0 0 .8rem}
h1{font-size:clamp(1.7rem,4vw,2.3rem);letter-spacing:-.02em;margin:0 0 .8rem}
p.lede{color:rgba(255,255,255,.78);font-size:1rem;margin:0 0 2rem}
a.btn{display:inline-block;background:#fff;color:var(--navy-900);text-decoration:none;font-weight:600;font-size:.9rem;padding:.7rem 1.4rem;border-radius:999px}
a.btn:hover{background:var(--blue-200)}
</style>
</head>
<body>
<div class="wrap">
  <a class="mark" href="/">Human <span>Metrix</span></a>
  <p class="eyebrow">Subscribed</p>
  <h1>You&rsquo;re on the list.</h1>
  <p class="lede">We&rsquo;ll email you when the next model ships. No recurring newsletter, no spam.</p>
  <a class="btn" href="/">Back to Human Metrix</a>
</div>
</body>
</html>
